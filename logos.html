<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Topographic Marks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #efeeeb; --card: #fbfbfa; --ink: #1c1c1e; --muted: #8d8b85; --hair: rgba(28,28,30,.08); --accent: #e8572a;
  --sans: "Instrument Sans", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; padding-inline: 16px; padding-block: 40px 64px; }
main { max-width: 1080px; margin: 0 auto; }
h1 { font-size: clamp(40px, 7vw, 72px); font-weight: 600; font-stretch: 85%; letter-spacing: -0.04em; line-height: .95; margin: 0 0 32px; text-wrap: balance; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr)); gap: 14px; }
.card { background: var(--card); border-radius: 18px; box-shadow: 0 0 0 1px rgba(28,28,30,.06), 0 1px 2px rgba(28,28,30,.05); overflow: hidden; display: grid; grid-template-rows: 220px auto; min-width: 0; }
.stage { display: grid; place-items: center; padding: 24px; border-bottom: 1px solid var(--hair); }
.lockup { display: flex; align-items: center; gap: 14px; }
.big .lg-word { font-size: 52px; }
.big .lg-mark { width: 60px; height: 60px; }
.big .lg-svg { height: 96px; max-width: 100%; }
.meta { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center; padding: 16px 20px 18px; }
.meta h2 { margin: 0; font-size: 22px; font-weight: 600; font-stretch: 90%; letter-spacing: -0.02em; }
.meta p { grid-column: 1 / -1; margin: 0; color: #5c5b56; font-size: 14px; line-height: 1.45; max-width: 60ch; }
.small { display: flex; align-items: center; gap: 8px; }
.small .lg-word { font-size: 18px; }
.small .lg-mark { width: 22px; height: 22px; }
.small .lg-svg { height: 30px; }
.id { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.lg-word { line-height: 1; white-space: nowrap; color: var(--ink); }
.ring-o { display: inline-block; width: .58em; height: .58em; vertical-align: -0.04em; margin: 0 .015em; overflow: visible; }
.lg-mark { flex: none; display: block; }
.lg-stack { display: inline-grid; }
.lg-profile { width: 100%; height: .46em; margin-top: -.3em; }
</style>
</head>
<body>
<main>
  <h1>Topographic marks</h1>
  <div class="grid" id="grid"></div>
</main>
<script src="engine.js"></script>
<script src="brand.js"></script>
<script>
  const grid = document.getElementById("grid");
  TopoBrand.concepts.forEach((c, i) => {
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `<div class="stage"><div class="lockup big">${c.html()}</div></div>
      <div class="meta"><h2>${String.fromCharCode(65 + i)}. ${c.name}</h2><div class="small">${c.html()}</div><p>${c.note}</p></div>`;
    grid.appendChild(card);
  });
</script>
</body>
</html>
